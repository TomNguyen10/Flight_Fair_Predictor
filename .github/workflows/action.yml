name: Flight Data Collection

on:
  # Run on push to the main branch
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 1:00 AM UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:
    # Allow manual triggering

jobs:
  collect-flight-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flight data collection script
        run: python direct_flights_map.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/direct_flights_map.csv
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Update flight data [automated]"
          git push
