name: Update Direct Flights Data

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-flight-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      - run: |
          pip install fast-flights
          python direct_flights_map.py
