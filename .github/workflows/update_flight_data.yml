name: Update Direct Flights Data

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-flight-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fast-flights
          pip freeze > requirements.txt
          cat requirements.txt

      - name: Check directory structure
        run: |
          pwd
          ls -la
          mkdir -p data
          ls -la data/

      - name: Run flight data script with debug
        run: |
          echo "Running script with sample size of 2 for testing..."
          python direct_flights_map.py --sample-size 2 --delay 2
        env:
          PYTHONUNBUFFERED: "1"
