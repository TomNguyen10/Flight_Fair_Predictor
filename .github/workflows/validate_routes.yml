name: Validate International Routes

on:
  push:
    branches:
      - main # or your default branch name
      - develop # if you have a development branch
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Keep manual trigger option

jobs:
  validate-routes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy fast-flights

      - name: Create data directory
        run: mkdir -p data

      - name: Run route validation
        run: python validate_routes.py

      - name: Upload validation results
        uses: actions/upload-artifact@v3
        with:
          name: route-validation-results
          path: data/route_validation_*.json

      - name: Create summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('data/route_validation_summary.json', 'utf8'));

            const comment = `## Route Validation Results

            ### Summary
            - Total Routes Checked: ${summary.total_routes}
            - Valid Routes: ${summary.valid_routes}
            - Invalid Routes: ${summary.invalid_routes}
            - Validation Time: ${new Date(summary.timestamp).toLocaleString()}

            ### Validation Dates
            ${summary.validation_dates.map(date => `- ${date}`).join('\n')}

            ### Details
            Full validation results are available in the artifacts.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Create commit status
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('data/route_validation_summary.json', 'utf8'));

            const success = summary.valid_routes > 0;
            const status = success ? 'success' : 'failure';
            const description = `${summary.valid_routes} valid routes found out of ${summary.total_routes}`;

            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'Route Validation'
            });
