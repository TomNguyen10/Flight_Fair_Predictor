 name: Run Flight Map Generator

on:
  # Manual trigger
  workflow_dispatch:
  # Schedule to run weekly (adjust as needed)
  schedule:
    - cron: '0 0 * * 0'  # Run at midnight UTC every Sunday

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fast-flights
        
    - name: Run flight map script
      run: |
        python direct_flights_map.py --sample-size 50 --delay 1.5
        
    - name: Upload results
      uses: actions/upload-artifact@v3
      with:
        name: flight-data
        path: data/direct_flights_map.csv
        
    - name: Commit and push results
      if: success()
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add data/direct_flights_map.csv
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update direct flights map [skip ci]" && git push)