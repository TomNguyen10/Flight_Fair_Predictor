name: Generate Flight Connection Graphs

on:
  push:
    branches:
      - main

jobs:
  generate_connections:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flight connection generator
        run: |
          python data/flight_graph_threaded.py

      - name: Check for errors
        run: |
          if [ -f "flight_connections_error.log" ]; then
            echo "Error detected during execution:"
            cat flight_connections_error.log
            exit 1
          fi

      - name: Upload connection data
        uses: actions/upload-artifact@v4
        with:
          name: flight-connections
          path: |
            flight_connections_*.json
            flight_connections_*.csv
            flight_connections_summary.json
          retention-days: 7

      - name: Commit results to repository
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add flight_connections_*.json flight_connections_all.csv flight_connections_summary.json
          git commit -m "Add flight connections data [skip ci]" || echo "No changes to commit"
          git push
