name: Flight Connections Graph Generator

on:
  push:
    branches:
      - main # Change this to your default branch if it's different

jobs:
  generate-flight-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas fast-flights
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run flight connections generator
        run: |
          cd data
          python flight_graph_threaded.py

      - name: Check results
        run: |
          if [ -f data/flight_connections_all.csv ]; then
            echo "Flight connections generated successfully"
            echo "Total connections: $(wc -l < data/flight_connections_all.csv)"
          else
            echo "Failed to generate flight connections"
            cat data/flight_connections_error.log
            exit 1
          fi

      - name: Archive results
        uses: actions/upload-artifact@v3.1.0 # Updated to the latest version
        with:
          name: flight-connections
          path: |
            data/flight_connections_*.csv
            data/flight_connections_*.json
            data/flight_connections_summary.json
          retention-days: 30
